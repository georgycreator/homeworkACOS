# Сторона A прекращает огонь на первом такте из-за бюджета (budget < цены выстрела),
# но продолжает получать пополнение, пока воюет B. Как и в IDZ3, пополнение идёт
# независимо от того, прекратила ли сторона огонь, — это видно по остатку снарядов A.
max_ticks=8
tick_ms=0
seed=5
log=duel_replenish_after_stop.log
A.name=A
A.rows=4
A.cols=4
A.ammo=5
A.ammo_cost=10
A.budget=5
A.accuracy=100
A.replenish_every=1
A.replenish_amount=1
A.area_ammo=0
A.target=1 1 10
B.name=B
B.rows=4
B.cols=4
B.ammo=100
B.ammo_cost=1
B.budget=0
B.accuracy=0
B.area_ammo=0
B.target=2 2 10
