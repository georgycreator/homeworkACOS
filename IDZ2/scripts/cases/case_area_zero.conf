# case_area_zero — регрессия: тяжёлые снаряды с радиусом 0 и нулевой ценой при
# пустом запасе обычных. Раньше сторона получала ложное «бюджет исчерпан (0 из 100)»
# и тяжёлые снаряды молча не применялись. Теперь радиус 0 — залп по одной клетке,
# цена 0 — бесплатный снаряд, а пополнение обычных снарядов учитывается.
