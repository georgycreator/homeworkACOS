# case_destroyed_cell — повторное попадание в разрушенную клетку не даёт результата.
# B: две цели в поле 1x2. A стреляет случайно и точно (accuracy=100), поэтому
# до уничтожения второй цели неизбежно повторное попадание в уже разрушенную.
# Проверка: событие «уже разрушена» есть, стоимость потерь B = 12 и не больше,
# число живых целей B не отрицательно, каждая цель учтена один раз.
max_ticks=60
tick_ms=0
seed=11
log=duel_destroyed.log

A.name=A
A.rows=1
A.cols=1
A.ammo=60
A.ammo_cost=1
A.budget=0
A.accuracy=100
A.strategy=random
A.area_ammo=0
A.target=0 0 10 штаб

B.name=B
B.rows=1
B.cols=2
B.ammo=0
B.ammo_cost=0
B.budget=0
B.accuracy=0
B.area_ammo=0
B.target=0 0 5 склад
B.target=0 1 7 радар
